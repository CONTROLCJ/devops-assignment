name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  # OIDC ve Cosign için gerekli izinler
  id-token: write 
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Örnek AWS Role ARN'si (long-lived secret KULLANILMAZ)
          role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsOIDCRole
          aws-region: eu-central-1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Imajın tarama yapılabilmesi için local Docker'a yüklenmesi
          tags: my-node-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            npmrc=${{ secrets.NPMRC_CONTENT }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-node-app:latest'
          format: 'table'
          # CRITICAL ve HIGH zafiyetlerde pipeline'ı kır (exit-code: 1)
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to Registry (AWS ECR Example)
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag my-node-app:latest $REGISTRY/my-node-app:latest
          docker push $REGISTRY/my-node-app:latest

      - name: Sign the published Docker image using Cosign
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          # Keyless image signing
          cosign sign --yes $REGISTRY/my-node-app:latest
