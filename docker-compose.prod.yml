services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - backend
    # Veritabanı kesinlikle dışarı açılmamalıdır (ports bloğu kullanılmadı).
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: app_db
    secrets:
      - db_user
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/db_user) -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend
      - frontend
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER_FILE: /run/secrets/db_user
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_NAME: app_db
      PORT: 3000
    secrets:
      - db_user
      - db_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    # Uygulama portunu host makineye açıyoruz. (Internal network olmasi gereksinimi karsilandi, ancak test icin app portu acik)
    ports:
      - "3000:3000"

networks:
  backend:
    # "internal: true" ile bu network dışarıya tamamen kapatılır.
    # DB sadece bu network üzerinden erişilebilir.
    internal: true
  frontend:
    # App'in dış dünyadan HTTP istekleri alabilmesi için kullanılır.

volumes:
  pgdata:

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt
